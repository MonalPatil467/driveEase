<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DriveEase | Vehicle Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🚗 DriveEase

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="index.html">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link active"
                       href="vehicles.html">

                        Vehicles

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="my-bookings.html">

                        My Bookings

                    </a>

                </li>

                <li class="nav-item">

                    <a class="btn btn-secondary ms-3"
                       href="login.html">

                        Login

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<section class="py-5">

    <div class="container">

        <div class="row">

            <div class="col-lg-6">

                <img id="vehicleImage"
                     class="img-fluid rounded shadow w-100">

            </div>

            <div class="col-lg-6 text-white">

                <h2 id="vehicleName"
                    class="mb-3">

                </h2>

                <hr>

                <div class="row">

                    <div class="col-6 mb-3">

                        <strong>Brand</strong>

                        <p id="brand"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Model</strong>

                        <p id="model"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Vehicle Type</strong>

                        <p id="vehicleType"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Fuel Type</strong>

                        <p id="fuelType"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Transmission</strong>

                        <p id="transmission"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Seating Capacity</strong>

                        <p id="seatingCapacity"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Color</strong>

                        <p id="color"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Manufacturing Year</strong>

                        <p id="manufacturingYear"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Location</strong>

                        <p id="location"></p>

                    </div>

                    <div class="col-6 mb-3">

                        <strong>Price Per Day</strong>

                        <h4 class="text-success">

                            ₹<span id="pricePerDay"></span>

                        </h4>

                    </div>

                </div>

                <h5 class="mt-4">

                    Description

                </h5>

                <p id="description">

                </p>

                <div class="d-grid mt-4">

                    <a id="bookNowBtn"
                       class="btn btn-secondary">

                        Book Now

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

<section class="py-5">

    <div class="container">

        <h3 class="mb-4">

            Customer Reviews

        </h3>

        <div id="reviewContainer"
             class="row g-4">

        </div>

    </div>

</section>

<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">

            © 2026 DriveEase. All Rights Reserved.

        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/vehicle-details.js"></script>

</body>

</html>
