<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DriveEase | Edit Vehicle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🚗 DriveEase

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="owner-dashboard.html">

                        Dashboard

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="vehicles.html">

                        Vehicles

                    </a>

                </li>

                <li class="nav-item">

                    <a class="btn btn-secondary ms-3"
                       href="login.html">

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card search-card p-4">

                    <h2 class="text-center mb-4">

                        Edit Vehicle

                    </h2>

                    <form id="editVehicleForm">

                        <input type="hidden"
                               id="vehicleId">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Brand

                                </label>

                                <input type="text"
                                       id="brand"
                                       class="form-control"
                                       required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Model

                                </label>

                                <input type="text"
                                       id="model"
                                       class="form-control"
                                       required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Vehicle Type

                                </label>

                                <select id="vehicleType"
                                        class="form-control">

                                    <option value="CAR">Car</option>
                                    <option value="SUV">SUV</option>
                                    <option value="BIKE">Bike</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Fuel Type

                                </label>

                                <select id="fuelType"
                                        class="form-control">

                                    <option value="PETROL">Petrol</option>
                                    <option value="DIESEL">Diesel</option>
                                    <option value="CNG">CNG</option>
                                    <option value="ELECTRIC">Electric</option>

                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Transmission

                                </label>

                                <select id="transmission"
                                        class="form-control">

                                    <option value="MANUAL">Manual</option>
                                    <option value="AUTOMATIC">Automatic</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Seating Capacity

                                </label>

                                <input type="number"
                                       id="seatingCapacity"
                                       class="form-control"
                                       required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Manufacturing Year

                                </label>

                                <input type="number"
                                       id="manufacturingYear"
                                       class="form-control"
                                       required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Color

                                </label>

                                <input type="text"
                                       id="color"
                                       class="form-control"
                                       required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Location

                            </label>

                            <input type="text"
                                   id="location"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Price Per Day (₹)

                            </label>

                            <input type="number"
                                   id="pricePerDay"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Image URL

                            </label>

                            <input type="text"
                                   id="imageUrl"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Description

                            </label>

                            <textarea id="description"
                                      rows="4"
                                      class="form-control">

                            </textarea>

                        </div>

                        <div class="d-grid">

                            <button class="btn btn-secondary"
                                    type="submit">

                                Update Vehicle

                            </button>

                        </div>

                        <div id="message"
                             class="text-center mt-3">

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">

            © 2026 DriveEase. All Rights Reserved.

        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/edit-vehicle.js"></script>

</body>

</html>
