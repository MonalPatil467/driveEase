<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DriveEase | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🚗 DriveEase

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="index.html">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="vehicles.html">

                        Vehicles

                    </a>

                </li>

                <li class="nav-item">

                    <a class="btn btn-secondary ms-3"
                       href="login.html">

                        Login

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">

                <div class="card search-card p-4">

                    <div class="text-center mb-4">

                        <h2>

                            Create Account

                        </h2>

                        <p class="text-light">

                            Register to start renting vehicles

                        </p>

                    </div>

                    <form id="registerForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    First Name

                                </label>

                                <input
                                        type="text"
                                        id="firstName"
                                        class="form-control"
                                        placeholder="Enter First Name"
                                        required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Last Name

                                </label>

                                <input
                                        type="text"
                                        id="lastName"
                                        class="form-control"
                                        placeholder="Enter Last Name"
                                        required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Email

                                </label>

                                <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        placeholder="Enter Email"
                                        required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Phone Number

                                </label>

                                <input
                                        type="text"
                                        id="phoneNumber"
                                        class="form-control"
                                        placeholder="Enter Phone Number"
                                        required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Address

                            </label>

                            <input
                                    type="text"
                                    id="address"
                                    class="form-control"
                                    placeholder="Enter Address"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Register As

                            </label>

                            <select
                                    id="role"
                                    class="form-select">

                                <option value="CUSTOMER">

                                    Customer

                                </option>

                                <option value="OWNER">

                                    Owner

                                </option>

                            </select>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        placeholder="Create Password"
                                        required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Confirm Password

                                </label>

                                <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control"
                                        placeholder="Confirm Password"
                                        required>

                            </div>

                        </div>

                        <div class="d-grid mt-3">

                            <button
                                    type="submit"
                                    class="btn btn-secondary">

                                Register

                            </button>

                        </div>

                    </form>

                    <div
                            id="message"
                            class="mt-3 text-center">

                    </div>

                    <hr>

                    <p class="text-center">

                        Already have an account?

                        <a
                                href="login.html"
                                class="text-white">

                            Login Here

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">

            © 2026 DriveEase. All Rights Reserved.

        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/register.js"></script>

</body>

</html>
