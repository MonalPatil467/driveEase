<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DriveEase | Vehicles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🚗 DriveEase

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="index.html">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link active"
                       href="vehicles.html">

                        Vehicles

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="my-bookings.html">

                        My Bookings

                    </a>

                </li>

                <li class="nav-item">

                    <a class="btn btn-secondary ms-3"
                       href="login.html">

                        Login

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<section class="py-5">

    <div class="container">

        <h2 class="text-center mb-4">

            Available Vehicles

        </h2>

        <div class="card search-card p-4 mb-5">

            <div class="row g-3">

                <div class="col-md-3">

                    <input type="text"
                           id="searchLocation"
                           class="form-control"
                           placeholder="Location">

                </div>

                <div class="col-md-3">

                    <select id="searchType"
                            class="form-control">

                        <option value="">

                            All Vehicle Types

                        </option>

                        <option value="CAR">

                            Car

                        </option>

                        <option value="SUV">

                            SUV

                        </option>

                        <option value="BIKE">

                            Bike

                        </option>

                    </select>

                </div>

                <div class="col-md-3">

                    <input type="number"
                           id="maxPrice"
                           class="form-control"
                           placeholder="Max Price Per Day">

                </div>

                <div class="col-md-3 d-grid">

                    <button class="btn btn-secondary"
                            id="searchBtn">

                        Search

                    </button>

                </div>

            </div>

        </div>

        <div class="row"
             id="vehicleContainer">

        </div>

    </div>

</section>

<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">

            © 2026 DriveEase. All Rights Reserved.

        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/vehicles.js"></script>

</body>

</html>
