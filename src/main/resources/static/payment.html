<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DriveEase | Book Vehicle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🚗 DriveEase

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="index.html">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="vehicles.html">

                        Vehicles

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="my-bookings.html">

                        My Bookings

                    </a>

                </li>

                <li class="nav-item">

                    <a class="btn btn-secondary ms-3"
                       href="login.html">

                        Login

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card search-card p-4">

                    <h2 class="text-center mb-4">

                        Book Your Vehicle

                    </h2>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Pickup Date

                            </label>

                            <input type="date"
                                   id="pickupDate"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Return Date

                            </label>

                            <input type="date"
                                   id="returnDate"
                                   class="form-control"
                                   required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Pickup Location

                            </label>

                            <input type="text"
                                   id="pickupLocation"
                                   class="form-control"
                                   placeholder="Enter pickup location">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Return Location

                            </label>

                            <input type="text"
                                   id="returnLocation"
                                   class="form-control"
                                   placeholder="Enter return location">

                        </div>

                    </div>

                    <hr>

                    <div class="row">

                        <div class="col-md-6">

                            <h5>

                                Rental Days

                            </h5>

                            <h4 id="totalDays">

                                0

                            </h4>

                        </div>

                        <div class="col-md-6 text-end">

                            <h5>

                                Total Amount

                            </h5>

                            <h3 class="text-success">

                                ₹<span id="totalAmount">0</span>

                            </h3>

                        </div>

                    </div>

                    <div class="d-grid mt-4">

                        <button class="btn btn-secondary"
                                id="confirmBookingBtn">

                            Confirm Booking

                        </button>

                    </div>

                    <div id="bookingMessage"
                         class="mt-3 text-center">

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">

            © 2026 DriveEase. All Rights Reserved.

        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/booking.js"></script>

</body>

</html>
