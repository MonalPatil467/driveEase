<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DriveEase | Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🚗 DriveEase

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link active"
                       href="admin-dashboard.html">

                        Dashboard

                    </a>

                </li>

                <li class="nav-item">

                    <a class="btn btn-secondary ms-3"
                       href="login.html">

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<section class="py-5">

    <div class="container">

        <h2 class="text-center mb-5">

            Admin Dashboard

        </h2>

        <div class="row g-4 mb-5">

            <div class="col-md-3">

                <div class="card info-card text-center p-4">

                    <h3 id="totalUsers">

                        0

                    </h3>

                    <h5>

                        Users

                    </h5>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card info-card text-center p-4">

                    <h3 id="totalVehicles">

                        0

                    </h3>

                    <h5>

                        Vehicles

                    </h5>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card info-card text-center p-4">

                    <h3 id="totalBookings">

                        0

                    </h3>

                    <h5>

                        Bookings

                    </h5>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card info-card text-center p-4">

                    <h3 id="totalRevenue">

                        ₹0

                    </h3>

                    <h5>

                        Revenue

                    </h5>

                </div>

            </div>

        </div>

        <div class="card search-card p-4 mb-5">

            <h4 class="mb-4">

                Recent Bookings

            </h4>

            <div class="table-responsive">

                <table class="table table-dark table-hover">

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Customer</th>

                        <th>Vehicle</th>

                        <th>Status</th>

                        <th>Amount</th>

                    </tr>

                    </thead>

                    <tbody id="bookingTable">

                    </tbody>

                </table>

            </div>

        </div>

        <div class="card search-card p-4">

            <h4 class="mb-4">

                Recent Vehicles

            </h4>

            <div class="table-responsive">

                <table class="table table-dark table-hover">

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Brand</th>

                        <th>Model</th>

                        <th>Owner</th>

                        <th>Price/Day</th>

                    </tr>

                    </thead>

                    <tbody id="vehicleTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>

<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">

            © 2026 DriveEase. All Rights Reserved.

        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/admin-dashboard.js"></script>

</body>

</html>
